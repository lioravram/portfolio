  <meta property="og:title" content="Lior Avram — Automation & Web Development" />

  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #09090b; color: #e4e4e7; font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    ::selection { background: #3b82f6; color: #fff; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease-out both; }
    .fade-up-1 { animation-delay: 0.05s; }
    .fade-up-2 { animation-delay: 0.1s; }
    .fade-up-3 { animation-delay: 0.15s; }
    .fade-up-4 { animation-delay: 0.2s; }
    .fade-up-5 { animation-delay: 0.25s; }
    .fade-up-6 { animation-delay: 0.3s; }
    .fade-up-7 { animation-delay: 0.35s; }

        status: "completed",

        problem: "Client was manually logging into Home Depot every week, scrolling through purchase history, matching receipts to jobs, and organizing everything into spreadsheets. Hours of work, frequent mistakes.",
        results: [
          "Hours of weekly manual bookkeeping reduced to a single click",
          "Zero missed receipts or mismatched job assignments",
          "Organized weekly folders with PDF receipts and Excel reports ready for bookkeeper"
        ],

      },
      {
        title: "Interactive Sailing Trip Planner",

        tag: "Web App",
        tagColor: "#3b82f6",
        status: "completed",
        desc: "Full-stack interactive trip planning app for a 7-day bareboat sailing charter along Croatia's Dalmatian coast. Consolidated route mapping, day-by-day itineraries, packing checklists, and budget tracking into one shareable URL.",

        results: [
          "Replaced 6+ browser tabs and 2 spreadsheets with a single URL",
          "Interactive SVG route map with clickable navigation between stops",
          "Persistent packing checklist, budget tracker, and editable notes across sessions"
        ],
        tech: ["HTML/CSS/JS", "Firebase", "Netlify", "Google OAuth"],
        icon: "⛵",
      },
      {
        title: "Property Website Redesign",
        client: "Construction Client",
        tag: "Web Design",
        tagColor: "#f59e0b",
        status: "in-progress",
        desc: "Building a modern, SEO-optimized website for one of the client's rental properties. Mobile-first design with booking integration and professional photography showcase.",
        icon: "🏠",
      },
      {
        title: "Multi-Property Digital Marketing",
        client: "Construction Client",
        tag: "Marketing",
        tagColor: "#ec4899",
        status: "in-progress",
        desc: "Managing SEO, Google Business profiles, Google PPC campaigns, and social media marketing and advertising across 3 properties. Full-funnel strategy from search visibility to paid acquisition.",
        icon: "📈",
      },
      {
        title: "Contractor Daily Reporting Dashboard",
        client: "Construction Client",
        tag: "SaaS Tool",
        tagColor: "#8b5cf6",
        status: "in-progress",
        desc: "Building a custom application where subcontractors report daily work completed, managers receive automatic updates, and a real-time dashboard tracks progress across all active jobs.",

    const SERVICES = [
      {
        name: "Custom Automation",
        desc: "Turn repetitive manual work into one-click systems. Data entry, report generation, file organization, notifications.",

      },
      {
        name: "Website Design & Development",
        desc: "Modern, mobile-first websites built for speed and SEO. From single-page sites to full web applications.",
        icon: "🌐",
      },
      {
        name: "Digital Marketing",
        desc: "SEO, Google Business, PPC, and social media management. Full-funnel strategy from visibility to conversion.",
        icon: "📈",
      },
      {
        name: "Custom Business Tools",
        desc: "Dashboards, trackers, reporting systems, and internal tools built to solve your specific workflow problems.",
        icon: "🛠️",
      },
    ];

    function ProjectCard({ project, index }) {
      const [isOpen, setIsOpen] = useState(false);
      const isCompleted = project.status === "completed";

      return (
        <div
          className={`fade-up fade-up-${index + 1}`}
          onClick={() => setIsOpen(!isOpen)}
          style={{
            background: isOpen ? "#18181b" : "#111113",
            border: `1px solid ${isOpen ? project.tagColor + "44" : "#1c1c1f"}`,
            borderRadius: 12,
            padding: "18px 20px",
            marginBottom: 12,
            cursor: "pointer",
            transition: "all 0.2s ease",
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div style={{ display: "flex", gap: 14, alignItems: "flex-start", flex: 1 }}>
              <div style={{ fontSize: 30, lineHeight: 1 }}>{project.icon}</div>
              <div>
                <div style={{ fontWeight: 700, fontSize: 16, color: "#fafafa", marginBottom: 6, lineHeight: 1.3 }}>
                  {project.title}

                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{
                    fontSize: 10,
                    fontWeight: 700,
                    padding: "3px 8px",
                    borderRadius: 4,
                    background: project.tagColor + "18",
                    color: project.tagColor,
                    letterSpacing: 0.5,
                    textTransform: "uppercase",
                  }}>
                    {project.tag}
                  </span>
                  {!isCompleted && (
                    <span style={{
                      display: "inline-flex",
                      alignItems: "center",
                      gap: 5,
                      fontSize: 10,
                      color: "#f59e0b",
                      fontWeight: 600,
                    }}>
                      <span style={{ width: 5, height: 5, borderRadius: "50%", background: "#f59e0b" }} />

                    </span>
                  )}
                  <span style={{ fontSize: 12, color: "#52525b" }}>{project.client}</span>
                </div>
              </div>
            </div>
            <div style={{
              color: "#52525b",
              fontSize: 20,
              transform: isOpen ? "rotate(45deg)" : "none",
              transition: "transform 0.2s",
              flexShrink: 0,
              marginLeft: 8,
            }}>+</div>
          </div>

          {isOpen && (
            <div style={{ marginTop: 18, paddingTop: 16, borderTop: "1px solid #27272a" }}>

                    textTransform: "uppercase", marginBottom: 6, fontWeight: 700,
                    fontFamily: "'JetBrains Mono', monospace",

                  <p style={{ fontSize: 14, color: "#a1a1aa", lineHeight: 1.65, margin: 0 }}>

                  fontSize: 10, letterSpacing: 2, color: "#71717a",

                }}>

                </div>
                <p style={{ fontSize: 14, color: "#a1a1aa", lineHeight: 1.65, margin: 0 }}>
                  {project.desc}
                </p>
              </div>

              {project.results && (
                <div style={{ marginBottom: 14 }}>
                  <div style={{
                    fontSize: 10, letterSpacing: 2, color: "#10b981",
                    textTransform: "uppercase", marginBottom: 8, fontWeight: 700,
                    fontFamily: "'JetBrains Mono', monospace",
                  }}>
                    Results
                  </div>
                  {project.results.map((r, j) => (
                    <div key={j} style={{ display: "flex", gap: 10, marginBottom: 6 }}>
                      <span style={{ color: "#10b981", fontWeight: 700, fontSize: 14 }}>→</span>
                      <span style={{ fontSize: 14, color: "#d4d4d8", lineHeight: 1.5 }}>{r}</span>
                    </div>
                  ))}
                </div>
              )}

              {project.tech && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
                  {project.tech.map((t, j) => (
                    <span key={j} style={{
                      fontSize: 11,
                      padding: "4px 10px",
                      borderRadius: 5,
                      background: "#27272a",
                      color: "#a1a1aa",
                      fontFamily: "'JetBrains Mono', monospace",
                    }}>
                      {t}

                  ))}

      return (

          {/* Header */}

            <div style={{
              fontSize: 11, letterSpacing: 5, color: "#3b82f6",
              textTransform: "uppercase", marginBottom: 10, fontWeight: 700,
              fontFamily: "'JetBrains Mono', monospace",
            }}>
              Lior Avram
            </div>
            <h1 style={{
              fontSize: 32, fontWeight: 800, margin: "0 0 10px",
              color: "#fafafa", lineHeight: 1.15, letterSpacing: -0.5,
            }}>
              I build tools that save businesses time and money.
            </h1>
            <p style={{
              fontSize: 15, color: "#71717a", margin: "0 0 24px", lineHeight: 1.6,
            }}>
              Automation, web apps, and digital marketing for construction, restoration, and service businesses. Based in Fort Lauderdale, FL.

            <a href="https://linkedin.com/in/lioravram" target="_blank" rel="noopener" style={{
              fontSize: 13, fontWeight: 600, padding: "8px 18px", borderRadius: 8,
              background: "#0a66c2", color: "#fff", display: "inline-block",
              transition: "opacity 0.2s",
            }}>
              LinkedIn
            </a>
            <a href="mailto:lioravram08@gmail.com" style={{
              fontSize: 13, fontWeight: 600, padding: "8px 18px", borderRadius: 8,
              background: "#27272a", color: "#fafafa", display: "inline-block",

            </a>

              fontSize: 13, fontWeight: 600, padding: "8px 18px", borderRadius: 8,
              background: "#27272a", color: "#fafafa", display: "inline-block",

                  padding: "12px 20px", fontSize: 14,
                  fontWeight: activeTab === tab.id ? 700 : 400,
                  color: activeTab === tab.id ? "#fafafa" : "#71717a",
                  background: "none", border: "none",
                  borderBottom: activeTab === tab.id ? "2px solid #3b82f6" : "2px solid transparent",

                ].map((stat, i) => (
                  <div key={i} style={{
                    flex: stat.wide ? 2 : 1, background: "#141416",

                  }}>
                    <div style={{
                      fontSize: 10, color: "#52525b", letterSpacing: 1,
                      textTransform: "uppercase", marginBottom: 6,
                      fontFamily: "'JetBrains Mono', monospace",
                    }}>
                      {stat.label}
                    </div>
                    <div style={{ fontSize: stat.wide ? 12 : 24, fontWeight: 700, color: stat.color }}>
                      {stat.value}

              </div>

                    fontFamily: "'JetBrains Mono', monospace",
                  }}>

                  </span>
                ))}
              </div>

              <div style={{
                fontSize: 10, letterSpacing: 3, color: "#3b82f6",
                textTransform: "uppercase", fontWeight: 700, marginBottom: 12,
                fontFamily: "'JetBrains Mono', monospace",
              }}>
                Industry Experience
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
